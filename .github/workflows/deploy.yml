name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html JS syntax
        run: |
          node -e "
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const m=html.match(/<script>([\s\S]*?)<\/script>/);
          if(m){try{new Function(m[1]);console.log('JS syntax OK');}catch(e){console.error('JS syntax error:',e.message);process.exit(1);}}
          "

      - name: Validate server starts
        run: |
          node -e "require('./server.js')" &
          SERVER_PID=$!
          sleep 3
          curl -sf http://localhost:3456/api/years | head -c 200 || echo "Note: server requires live internet access, skipping curl check"
          kill $SERVER_PID 2>/dev/null || true

      - name: Trigger Render deploy
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -sf "$RENDER_DEPLOY_HOOK"
          else
            echo "No deploy hook configured, skipping."
          fi
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
